name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Localizar o Generar gradlew
        run: |
          # 1. Si los archivos están dentro de una subcarpeta, moverlos a la raíz
          if [ ! -f "gradlew" ]; then
            FOUND=$(find . -maxdepth 3 -name "gradlew" -print -quit)
            if [ -n "$FOUND" ]; then
              SUBDIR=$(dirname "$FOUND")
              echo "Proyecto detectado en subcarpeta: $SUBDIR. Moviendo a la raíz..."
              cp -r "$SUBDIR"/* .
            fi
          fi

          # 2. Si todavía no existe gradlew, generarlo automáticamente con Gradle
          if [ ! -f "gradlew" ]; then
            echo "gradlew no encontrado en el repositorio. Generándolo automáticamente..."
            gradle wrapper
          fi

          # 3. Dar permisos de ejecución explícitamente a ./gradlew
          chmod +x ./gradlew
          ls -la ./gradlew

      - name: Proveer debug.keystore si falta
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore no encontrado. Generándolo con keytool para signingConfig 'debugConfig'..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Proveer google-services.json si falta
        run: |
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo "Creando app/google-services.json para com.aistudio.vegas50k.vgtrak..."
            echo '{"project_info":{"project_number":"121910575604","project_id":"vegas-50k-app"},"client":[{"client_info":{"mobilesdk_app_id":"1:121910575604:android:7d8a9e0f1b2c3d4e5f6a","android_client_info":{"package_name":"com.aistudio.vegas50k.vgtrak"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyA1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Compilar APK Debug con Gradle
        run: ./gradlew assembleDebug -x lint -x test --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Vegas-50k-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
