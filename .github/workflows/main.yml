- name: Generar google-services.json dummy si no existe
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Generando google-services.json simulado para CI..."
            cat < app/google-services.json
            {
              "project_info": {
                "project_number": "1234567890",
                "project_id": "vegas-dummy-id",
                "storage_bucket": "vegas-dummy-id.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                    "android_client_info": {
                      "package_name": "com.example.vegas50kk"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "dummy_api_key_for_ci_build"
                    }
                  ],
                  "services": {}
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi
