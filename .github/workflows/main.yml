name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Localizar o Generar gradlew
        run: |
          # 1. Si los archivos están dentro de una subcarpeta, moverlos a la raíz
          if [ ! -f "gradlew" ]; then
            FOUND=$(find . -maxdepth 3 -name "gradlew" -print -quit)
            if [ -n "$FOUND" ]; then
              SUBDIR=$(dirname "$FOUND")
              echo "Proyecto detectado en subcarpeta: $SUBDIR. Moviendo a la raíz..."
              cp -r "$SUBDIR"/* .
            fi
          fi

          # 2. Si todavía no existe gradlew, generarlo automáticamente con Gradle
          if [ ! -f "gradlew" ]; then
            echo "gradlew no encontrado en el repositorio. Generándolo automáticamente..."
            gradle wrapper
          fi

          # 3. Dar permisos de ejecución explícitamente a ./gradlew
          chmod +x ./gradlew
          ls -la ./gradlew

      - name: Proveer debug.keystore si falta
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore no encontrado. Generándolo con keytool para signingConfig 'debugConfig'..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Proveer google-services.json si falta
        run: |
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo "Creando app/google-services.json para com.aistudio.vegas50k.vgtrak..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "779512223094",
              "project_id": "civic-polymer-384419",
              "storage_bucket": "civic-polymer-384419.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:779512223094:android:561e91a7c37a0b42df1657",
                  "android_client_info": {
                    "package_name": "com.aistudio.vegas50k.vgtrak"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "779512223094-64rmehd48oocma7o40mmtq0hvf15bf3u.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyA808oIiCy9Q0GaULl24mpgb6YtCS0TElE"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Compilar APK Debug con Gradle
        run: ./gradlew bundleRelease -x lint -x test --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Vegas-50k-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
