name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Proveer google-services.json si falta
        run: |
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0000000000","project_id":"vegas-dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0000000000:android:000000000000","android_client_info":{"package_name":"com.vegas50k"}},"oauth_client":[],"api_key":[{"current_key":"fake_key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar APK Debug con Gradle
        run: ./gradlew assembleDebug -x lint -x test --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Vegas-50k-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
